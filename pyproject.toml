[project]
name = "humanoid-push"
version = "0.1.0"
description = "Personally recorded human pushes retargeted to a simulated Panda"
requires-python = ">=3.12,<3.13"
dependencies = [
  "robosuite==1.5.2",
  "mujoco==3.3.7",
  "numpy==1.26.4",
  "numba==0.61.2",
  "scipy==1.15.3",
  "opencv-python==4.11.0.86",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
learning = ["torch==2.5.1"]
learning-gpu = ["torch==2.5.1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv]
conflicts = [[{ extra = "learning" }, { extra = "learning-gpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "learning" },
  { index = "pytorch-cu118", extra = "learning-gpu" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
push-smoke = "humanoid_push.smoke:main"
push-track = "humanoid_push.tracking:main"
push-replay = "humanoid_push.replay:main"
push-bc-prepare = "humanoid_push.bc_data:main"
push-bc-train = "humanoid_push.bc_train:main"
push-bc-evaluate = "humanoid_push.bc_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/humanoid_push"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
